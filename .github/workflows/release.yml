# Publishes a release when a v* tag is pushed (#58), mirroring
# mayusuk/agent-loop's release workflow (#124): builds macOS (arm64, amd64)
# and Linux (amd64, arm64) binaries with GoReleaser (.goreleaser.yaml),
# creates the GitHub release with the CHANGELOG.md section for the version as
# its notes, and writes Formula/agent-loop-claude.rb to mayusuk/homebrew-tap.
#
# Needs the repository secret HOMEBREW_TAP_GITHUB_TOKEN: a fine-grained token
# with Contents read and write on mayusuk/homebrew-tap only.
#
# Third-party actions are pinned to full commit SHAs (version in the comment):
# this job holds a token that writes the tap every brew user installs from, so
# a moved tag must not reach it.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Linux: agent-loop-claude is pure Go, so every target cross-compiles
    # (work plan #58 D1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: tests
        run: go test -race -count=1 ./...
      # Fails, before anything is published, if the tag isn't Release in
      # cmd/agent-loop-claude/main.go or CHANGELOG.md has no section for it
      # (work plan #58 D2).
      - name: release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
